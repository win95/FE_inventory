# Docker Compose — Strapi + Postgres + Frontend (Plan §6).
#
# Chạy:  cp .env.example .env   (sửa các secret)  rồi  docker compose up --build -d
# Dừng:  docker compose down
#
# FastAPI + SQLite KHÔNG nằm trong Compose — chạy riêng trên host (xem SETUP.md
# mục 5, repo win95/BE_inventory). `docker compose up` thành công không có
# nghĩa là FastAPI đang chạy, và ngược lại.
services:
  # P0 K8s FE + cache: Redis dùng chung cho Next Data Cache (L2). Chỉ là
  # cache — mất dữ liệu = cache miss, FE tự build lại từ Strapi, không cần
  # backup như DB. Local dev chạy 1 replica; lên K8s dùng StatefulSet
  # (§5.4 thiết kế) hoặc managed Redis.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strapi}
      POSTGRES_USER: ${POSTGRES_USER:-strapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strapi} -d ${POSTGRES_DB:-strapi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  strapi:
    # Linux: host.docker.internal không có sẵn, map tới gateway của host
    # để container gọi được FastAPI chạy trên máy (cổng 8000).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build: ./cms
    restart: unless-stopped
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-strapi}
      DATABASE_USERNAME: ${POSTGRES_USER:-strapi}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      APP_KEYS: ${APP_KEYS:?Đặt APP_KEYS trong .env}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?Đặt API_TOKEN_SALT trong .env}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Đặt ADMIN_JWT_SECRET trong .env}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?Đặt TRANSFER_TOKEN_SALT trong .env}
      JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET trong .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Đặt ENCRYPTION_KEY trong .env}
      HOST: 0.0.0.0
      PORT: 1337
      STRAPI_WEBHOOK_URL: ${STRAPI_WEBHOOK_URL:-http://host.docker.internal:8000/api/webhooks/strapi}
      STRAPI_WEBHOOK_SECRET: ${STRAPI_WEBHOOK_SECRET:-}
    volumes:
      - strapi-uploads:/opt/app/public/uploads
    ports:
      - "1337:1337"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    # Linux: host.docker.internal không có sẵn, map tới gateway của host
    # để container gọi được FastAPI chạy trên máy (cổng 8000).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      args:
        # NEXT_PUBLIC_* nhúng vào bundle lúc build; NEXT_PUBLIC_STRAPI_URL
        # chỉ dùng phía server (remotePatterns + URL media) nên giá trị
        # localhost ở đây vẫn đúng khi build trong Compose.
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-http://localhost:1337}
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      # SSR trong container gọi Strapi qua tên service (localhost là chính container).
      STRAPI_INTERNAL_URL: http://strapi:1337
      # Backend FastAPI chạy trên host (ngoài Compose) — FE gọi qua proxy
      # /api/backend/* phía server. Không còn NEXT_PUBLIC_API_BASE_URL.
      BACKEND_URL: http://host.docker.internal:8000
      # P0 K8s FE + cache: Redis dùng chung cho Next Data Cache (L2).
      # Trong Compose thì gọi qua tên service redis; local không Compose
      # thì để redis://localhost:6379 (xem .env.example).
      PNCH_REDIS_URL: ${PNCH_REDIS_URL:-redis://redis:6379}
      PNCH_CACHE_APP: ${PNCH_CACHE_APP:-awing}
      # Secret cho POST /api/revalidate (khớp REVALIDATE_SECRET ở BE_inventory/.env).
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - strapi
      - redis

volumes:
  postgres-data:
  strapi-uploads:
  redis-data:
